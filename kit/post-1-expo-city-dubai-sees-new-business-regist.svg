<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1080" width="1080" height="1080" font-family="'Figtree','Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="cinematic" x="0" y="0" width="100%" height="100%">
      <feColorMatrix type="matrix" values="
        0.88 0 0.05 0 0
        0 0.95 0.05 0 0
        0.05 0.05 1.02 0 0
        0   0    0    1 0"/>
      <feComponentTransfer>
        <feFuncR type="gamma" amplitude="1" exponent="0.97" offset="0"/>
        <feFuncG type="gamma" amplitude="1" exponent="0.97" offset="0"/>
        <feFuncB type="gamma" amplitude="1" exponent="0.95" offset="0"/>
      </feComponentTransfer>
    </filter>
    <!-- darken: now very light. Photo dominates; only a soft scrim at the
         very bottom for text legibility. Earlier versions buried the photo. -->
    <linearGradient id="darken" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#06060f" stop-opacity="0.0"/>
      <stop offset="60%" stop-color="#06060f" stop-opacity="0.0"/>
      <stop offset="80%" stop-color="#06060f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06060f" stop-opacity="0.60"/>
    </linearGradient>
    <!-- textScrim: localized contrast band specifically behind text
         clusters. Used by layouts that put text low in the canvas. -->
    <linearGradient id="textScrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#06060f" stop-opacity="0"/>
      <stop offset="50%" stop-color="#06060f" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#06060f" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="fadeRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06060f" stop-opacity="0"/>
      <stop offset="60%" stop-color="#06060f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06060f" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="vignTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06060f" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#06060f" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06060f" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="vignCenter" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0%" stop-color="#06060f" stop-opacity="0"/>
      <stop offset="55%" stop-color="#06060f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06060f" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="accentGlow" cx="0.78" cy="0.22" r="0.55">
      <stop offset="0%" stop-color="#5B8DEE" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#5B8DEE" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#5B8DEE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brassUnder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A8926A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A8926A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A8926A" stop-opacity="0"/>
    </linearGradient>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.75"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1080" height="1080" fill="#06060f"/>

  <image href="/mics-social-media-engine/photos/growth/01_dubai_skyline_night.jpg" xlink:href="/mics-social-media-engine/photos/growth/01_dubai_skyline_night.jpg" x="0" y="-40" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" filter="url(#cinematic)"/>
  <rect width="1080" height="1080" fill="url(#darken)"/>
  <rect width="1080" height="1080" fill="url(#accentGlow)"/>
  <rect x="0" y="0" width="32" height="1080" fill="#5B8DEE"/>
  <rect x="32" y="0" width="1048" height="2" fill="#5B8DEE" opacity="0.4"/>

  <text x="80" y="92" font-size="20" font-weight="700" letter-spacing="4" fill="#A8926A" filter="url(#textShadow)">MICS  ·  CFOs PRIVATE INSIGHTS CIRCLE</text>
  <text x="80" y="128" font-size="17" letter-spacing="2" fill="rgba(234,230,222,0.6)" filter="url(#textShadow)">WORLD PULSE</text>

  <line x1="80" y1="610" x2="200" y2="610" stroke="#5B8DEE" stroke-width="2" opacity="0.85"/>
  <text x="80" y="660" font-size="22" font-weight="700" letter-spacing="6" fill="#5B8DEE" filter="url(#textShadow)">WEEK AHEAD MACRO</text>

  <text x="80" y="720" font-family="'Cormorant Garamond','Georgia',serif" font-size="280" font-weight="500" fill="#ffffff" filter="url(#textShadow)">25%</text>
  <text x="80" y="830" font-size="18" font-weight="600" letter-spacing="3" fill="#5B8DEE" filter="url(#textShadow)">INTERNATIONAL ADVISORY · CROSS-BORDER STRUCTURING</text>

  <text x="80" y="888" font-family="'Cormorant Garamond','Georgia',serif" font-size="42" font-weight="600" fill="#EAE6DE" filter="url(#textShadow)">Expo City Dubai sees new business</text>
  <text x="80" y="934" font-family="'Cormorant Garamond','Georgia',serif" font-size="42" font-weight="600" fill="#EAE6DE" filter="url(#textShadow)">registrations rise more than 25% in …</text>

  <line x1="40" y1="40" x2="90" y2="40" stroke="#A8926A" stroke-width="2"/>
  <line x1="40" y1="40" x2="40" y2="90" stroke="#A8926A" stroke-width="2"/>
  <line x1="1040" y1="40" x2="990" y2="40" stroke="#A8926A" stroke-width="2"/>
  <line x1="1040" y1="40" x2="1040" y2="90" stroke="#A8926A" stroke-width="2"/>
  <line x1="40" y1="1040" x2="90" y2="1040" stroke="#A8926A" stroke-width="2"/>
  <line x1="40" y1="1040" x2="40" y2="990" stroke="#A8926A" stroke-width="2"/>
  <line x1="1040" y1="1040" x2="990" y2="1040" stroke="#A8926A" stroke-width="2"/>
  <line x1="1040" y1="1040" x2="1040" y2="990" stroke="#A8926A" stroke-width="2"/>

  <rect x="120" y="180" width="60" height="2" fill="#5B8DEE" opacity="0.7"/>
  <rect x="900" y="180" width="60" height="2" fill="#5B8DEE" opacity="0.7"/>
  <rect x="120" y="930" width="60" height="2" fill="#A8926A" opacity="0.6"/>
  <rect x="900" y="930" width="60" height="2" fill="#A8926A" opacity="0.6"/>

  <rect x="80" y="1000" width="920" height="1" fill="url(#brassUnder)"/>
  <text x="540" y="1042" font-size="13" font-weight="700" letter-spacing="6" fill="rgba(168,146,106,0.7)" text-anchor="middle">MICS INTERNATIONAL</text>
</svg>
